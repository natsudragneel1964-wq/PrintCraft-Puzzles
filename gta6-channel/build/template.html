<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
:root{--a:#ff3d9a;--b:#ffb23f;--c:#35e0ff;--sky1:#0a0520;--sky2:#3b0f63;--sky3:#c2267a;--sky4:#ff8a3c;--ink:#0b0618}
body.miami{--a:#35e0ff;--b:#ff4fb0;--c:#ffe14d;--sky1:#050a24;--sky2:#1b1a6b;--sky3:#8a2bb8;--sky4:#ff5fa8}
body.toxic{--a:#b6ff3c;--b:#ff4fd8;--c:#35e0ff;--sky1:#07051c;--sky2:#2a0f5e;--sky3:#7a1fa8;--sky4:#ff6a5c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:"Inter Display","Inter",sans-serif;color:#fff;font-weight:900}
#stage{position:absolute;inset:0;overflow:hidden}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 38%,var(--sky3) 62%,var(--sky4) 76%)}
.stars i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff}
#sun{position:absolute;left:230px;top:960px;width:620px;height:620px;border-radius:50%;
 background:linear-gradient(180deg,#fff27a 0%,var(--b) 38%,var(--a) 100%);
 -webkit-mask:repeating-linear-gradient(180deg,#000 0 46px,transparent 46px 60px),linear-gradient(#000 0 52%,transparent 52%);
 -webkit-mask-composite:source-over;filter:drop-shadow(0 0 80px var(--a))}
#floor{position:absolute;left:-540px;top:1400px;width:2160px;height:900px;background:linear-gradient(180deg,#1a0633,#05020f);overflow:hidden}
#grid{position:absolute;inset:-100px;transform-origin:50% 0;transform:perspective(520px) rotateX(63deg);
 background-image:linear-gradient(var(--a) 0 4px,transparent 4px),linear-gradient(90deg,var(--a) 0 4px,transparent 4px);background-size:120px 120px;opacity:.75}
.horizon{position:absolute;left:0;top:1394px;width:100%;height:8px;background:var(--b);box-shadow:0 0 40px 10px var(--a)}
.palm{position:absolute;bottom:330px;width:420px;height:760px;transform-origin:50% 100%}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 80% 46% at 50% 38%,rgba(6,3,20,.78),rgba(6,3,20,.35) 70%,transparent),linear-gradient(180deg,rgba(6,3,20,.55),transparent 22%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px);mix-blend-mode:overlay}
#top{position:absolute;left:60px;top:120px;right:60px;height:80px;display:flex;align-items:center;gap:20px}
.bug{display:flex;align-items:center;gap:16px;background:rgba(8,4,24,.8);border:3px solid var(--a);border-radius:44px;padding:12px 28px 12px 16px;font-size:34px;letter-spacing:3px}
.bug .dot{width:38px;height:38px;border-radius:50%;background:var(--a);box-shadow:0 0 18px var(--a)}
.ep{margin-left:auto;font-size:30px;letter-spacing:3px;opacity:.85;background:rgba(8,4,24,.8);padding:14px 22px;border-radius:40px}
#prog{position:absolute;left:60px;right:60px;top:214px;height:8px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
#prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}
.scene{position:absolute;left:60px;width:960px;top:250px;height:960px;display:none;flex-direction:column;justify-content:center;align-items:center;gap:26px;text-align:center}
.glow{text-shadow:0 0 34px color-mix(in srgb,var(--a) 70%,transparent),0 8px 0 rgba(0,0,0,.45)}
.kicker{font-size:40px;letter-spacing:8px;color:var(--ink);background:var(--b);padding:12px 30px;border-radius:10px;transform:skewX(-8deg)}
.tl{font-style:italic;line-height:.95;letter-spacing:-3px;text-transform:uppercase;white-space:nowrap}
.tl.hl{color:var(--a);-webkit-text-stroke:0}
.card{background:rgba(9,5,28,.86);border:3px solid rgba(255,255,255,.16);border-radius:36px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.big{font-size:300px;line-height:.9;font-style:italic;letter-spacing:-10px;color:#fff}
.big small{font-size:110px;letter-spacing:-2px;color:var(--a);margin-left:14px}
.label{font-size:50px;letter-spacing:5px;color:var(--b)}
.sub{font-size:42px;font-weight:700;opacity:.92;max-width:860px}
.qtag{font-size:34px;letter-spacing:4px;background:#ffe14d;color:#111;padding:8px 20px;border-radius:8px}
.head{font-size:52px;letter-spacing:5px;color:var(--b);margin-bottom:6px}
.row{width:940px;display:flex;align-items:center;gap:24px;padding:26px 30px;font-size:50px;text-align:left}
.row .tag{flex:0 0 auto;min-width:92px;height:92px;border-radius:22px;background:var(--a);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:42px;padding:0 12px}
.row .t{flex:1;line-height:1.08}
.row .v{flex:0 0 auto;font-size:44px;color:var(--c);text-align:right;max-width:400px;line-height:1.05}
.row.hot{border-color:var(--b)} .row.hot .tag{background:var(--b)} .row.hot .v{color:var(--b)}
.vs{width:960px;display:flex;flex-direction:column;gap:18px}
.vsh{display:flex;gap:18px}.vsh div{flex:1;padding:22px 8px;font-size:58px;font-style:italic;border-radius:26px}
.vsh .l{background:rgba(9,5,28,.86);border:3px solid rgba(255,255,255,.3)}.vsh .r{background:var(--a);color:var(--ink)}
.vr{padding:16px 20px 22px}.vr .lab{font-size:32px;letter-spacing:5px;color:var(--b);margin-bottom:8px}
.vr .vals{display:flex;gap:18px;font-size:58px}.vr .vals div{flex:1}.vr .vals .r{color:var(--a)}
.vr.bigr .vals{font-size:84px;font-style:italic}
.verd .q{font-size:54px;line-height:1.1;max-width:900px}
.stamp{font-size:230px;font-style:italic;letter-spacing:-6px;line-height:1;padding:10px 46px 22px;border:14px solid;border-radius:36px;transform:rotate(-6deg);white-space:nowrap;background:rgba(9,5,28,.7)}
.stamp.no{color:#ff4d5e}.stamp.yes{color:#5dff9b}.stamp.warn{color:#ffe14d}
.bars{width:940px;display:flex;flex-direction:column;gap:30px}
.bar{padding:28px 30px;text-align:left}.bar .bl{font-size:44px;display:flex;justify-content:space-between;margin-bottom:18px}.bar .bl span:last-child{color:var(--a)}
.track{height:64px;border-radius:32px;background:rgba(255,255,255,.14);overflow:hidden}.track b{display:block;height:100%;width:0;border-radius:32px;background:linear-gradient(90deg,var(--a),var(--b))}
.cards{display:flex;gap:24px;width:960px}.pc{flex:1;padding:34px 22px 30px;display:flex;flex-direction:column;align-items:center;gap:16px}
.pc .ini{width:200px;height:200px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:140px;font-style:italic;background:linear-gradient(135deg,var(--a),var(--b));color:var(--ink)}
.pc .nm{font-size:44px;letter-spacing:1px}.pc .tr{font-size:34px;font-weight:700;line-height:1.15;background:rgba(255,255,255,.1);padding:12px 14px;border-radius:14px;width:100%}
.mapwrap{position:relative;width:960px;height:960px}.mapwrap svg{position:absolute;left:0;top:0}
.mlab{position:absolute;padding:12px 20px;border-radius:18px;background:rgba(9,5,28,.92);border:3px solid var(--a);font-size:34px;line-height:1.1;text-align:left;white-space:nowrap}
.mlab span{display:block;font-size:26px;font-weight:700;color:var(--b);margin-top:4px}
.mnote{position:absolute;left:0;top:62px;font-size:24px;font-weight:700;opacity:.7}
.mcount{position:absolute;left:0;top:0;font-size:46px;letter-spacing:4px;color:var(--b)}
.cta .sig{font-size:170px;font-style:italic;letter-spacing:-5px;line-height:.95}
.cta .name{font-size:92px;letter-spacing:4px;color:var(--ink);background:var(--a);padding:14px 36px;border-radius:20px;transform:skewX(-8deg)}
.cta .fine{font-size:26px;font-weight:600;opacity:.75;margin-top:20px}
#cap{position:absolute;left:70px;width:900px;top:1236px;height:230px;display:flex;align-items:center;justify-content:center;text-align:center;
 font-size:76px;line-height:1.08;letter-spacing:-1px;text-transform:uppercase;-webkit-text-stroke:16px #07030f;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.5)}
#cap span{display:inline-block;margin:0 9px}#cap span.on{color:#ffe14d}
</style>
</head>
<body>
<div id="stage">
  <div class="sky"></div><div class="stars" id="stars"></div>
  <div id="sun"></div>
  <div id="floor"><div id="grid"></div></div><div class="horizon"></div>
  <svg class="palm" id="p1" style="left:-110px" viewBox="0 0 420 760"><g fill="#07030f">
    <path d="M200 760 C205 600 190 470 214 330 L232 332 C214 470 232 600 236 760Z"/>
    <path d="M222 335 C150 250 70 250 10 300 C80 285 150 300 222 335Z"/><path d="M222 335 C170 220 110 170 30 170 C110 200 170 250 222 335Z"/>
    <path d="M222 335 C220 210 250 140 320 100 C280 170 250 240 222 335Z"/><path d="M222 335 C290 250 360 240 415 280 C350 275 290 290 222 335Z"/>
    <path d="M222 335 C300 310 370 340 400 410 C350 360 290 340 222 335Z"/><path d="M222 335 C150 320 90 360 60 430 C110 380 160 350 222 335Z"/></g></svg>
  <svg class="palm" id="p2" style="right:-140px;transform:scaleX(-1)" viewBox="0 0 420 760"><g fill="#07030f">
    <path d="M200 760 C205 600 190 470 214 330 L232 332 C214 470 232 600 236 760Z"/>
    <path d="M222 335 C150 250 70 250 10 300 C80 285 150 300 222 335Z"/><path d="M222 335 C170 220 110 170 30 170 C110 200 170 250 222 335Z"/>
    <path d="M222 335 C220 210 250 140 320 100 C280 170 250 240 222 335Z"/><path d="M222 335 C290 250 360 240 415 280 C350 275 290 290 222 335Z"/>
    <path d="M222 335 C300 310 370 340 400 410 C350 360 290 340 222 335Z"/><path d="M222 335 C150 320 90 360 60 430 C110 380 160 350 222 335Z"/></g></svg>
  <div class="shade"></div>
  <div id="scenes"></div>
  <div id="cap"></div>
  <div id="top"><div class="bug"><i class="dot"></i><span id="chan"></span></div><div class="ep" id="ep"></div></div>
  <div id="prog"><b></b></div>
  <div class="scan"></div>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const A=(b,fx,d=0)=>`data-b="${b||0}" data-fx="${fx}" data-d="${d}"`;
let TL=null;

const MAP={ // mapa esquemático propio (no oficial)
  land:"M40 150 L60 96 L200 84 L330 70 L430 82 L452 190 L486 330 L522 470 L528 560 L500 640 L452 668 L404 628 L372 548 L344 440 L316 320 L280 222 L210 176 L120 164 Z",
  keys:[[440,712,26,11],[392,738,22,10],[346,752,20,9],[300,756,18,8],[258,750,15,7]],
  pts:{vice:[500,560,28,-134],keys:[346,752,-347,-64],grass:[420,596,-346,-37],ambrosia:[410,420,-374,-36],port:[150,128,-212,74],kalaga:[366,150,60,-10]}
};
const B={
 title(d){const n=Math.max(...d.lines.map(l=>l.length));
  return `<div class="kicker" ${A(0,'pop')}>${esc(d.kicker)}</div>`+d.lines.map((l,i)=>{
    const fs=Math.min(250,Math.round(1500/Math.max(l.length,5)));
    return `<div class="tl glow ${(d.hl||[]).includes(i)?'hl':''}" style="font-size:${fs}px" ${A(0,i%2?'right':'left',.1+i*.13)}>${esc(l)}</div>`}).join('')},
 stat(d){const big=d.count!=null?`${d.pre||''}<span data-count="${d.count}">0</span>`:esc(d.big);
  const fs=d.count!=null?330:Math.min(330,Math.round(1500/Math.max(String(d.big).length,3)));
  return (d.q?`<div class="qtag" ${A(0,'pop')}>NO CONFIRMADO</div>`:'')+
   `<div class="big glow" style="font-size:${fs}px" ${A(0,'stampin',.05)}>${big}${d.unit?`<small>${esc(d.unit)}</small>`:''}</div>
   <div class="label" ${A(0,'up',.3)}>${esc(d.label)}</div>${d.sub?`<div class="sub card" style="padding:20px 34px" ${A(0,'up',.5)}>${esc(d.sub)}</div>`:''}`},
 list(d){return `<div class="head" ${A(0,'up')}>${esc(d.head)}</div>`+d.items.map((it,i)=>
   `<div class="row card ${it.hot?'hot':''}" ${A(it.b,'left',.04*i)}><div class="tag">${esc(it.tag)}</div><div class="t">${esc(it.t)}</div>${it.v?`<div class="v">${esc(it.v)}</div>`:''}</div>`).join('')},
 versus(d){return `<div class="vs"><div class="vsh" ${A(0,'up')}><div class="l">${esc(d.l.name)}</div><div class="r">${esc(d.r.name)}</div></div>`+
   d.rows.map(r=>`<div class="vr card ${r.big?'bigr':''}" ${A(r.b,'up',.05)}><div class="lab">${esc(r.label)}</div><div class="vals"><div class="l">${esc(r.l)}</div><div class="r">${esc(r.r)}</div></div></div>`).join('')+`</div>`},
 verdict(d){const fs=Math.min(250,Math.round(1250/Math.max(d.a.length,3)));
  return `<div class="verd"><div class="q card" style="padding:26px 34px" ${A(0,'up')}>${esc(d.q)}</div></div>
   <div class="stamp ${d.tone}" style="font-size:${fs}px" ${A(0,'stampin',.25)}>${esc(d.a)}</div>
   ${d.sub?`<div class="sub" ${A(d.sb||0,'up',.6)}>${esc(d.sub)}</div>`:''}`},
 bar(d){return `<div class="head" ${A(0,'up')}>${esc(d.head)}</div><div class="bars">`+d.rows.map(r=>
   `<div class="bar card" ${A(r.b,'up')}><div class="bl"><span>${esc(r.label)}</span><span>${esc(r.text)}</span></div><div class="track"><b data-w="${100*r.val/r.max}" data-b="${r.b}"></b></div></div>`).join('')+`</div>`},
 cards(d){return `<div class="cards">`+d.cards.map((c,i)=>`<div class="pc card" ${A(c.b,i?'right':'left')}><div class="ini">${c.initial}</div><div class="nm">${esc(c.name)}</div>`+
   c.traits.map((t,j)=>`<div class="tr" ${A(c.b,'up',.5+j*.55)}>${esc(t)}</div>`).join('')+`</div>`).join('')+`</div>`},
 map(d){const s=960/800;
  return `<div class="mapwrap"><div class="mcount" ${A(0,'up')}>LEONIDA · 6 REGIONES</div>
   <svg width="960" height="960" viewBox="-110 -10 800 800" ${A(0,'pop')}>
    <path d="${MAP.land}" fill="rgba(9,5,28,.9)" stroke="var(--a)" stroke-width="6" stroke-linejoin="round"/>
    ${MAP.keys.map(k=>`<ellipse cx="${k[0]}" cy="${k[1]}" rx="${k[2]}" ry="${k[3]}" fill="rgba(9,5,28,.9)" stroke="var(--a)" stroke-width="5"/>`).join('')}
    <ellipse cx="418" cy="470" rx="34" ry="26" fill="var(--c)" opacity=".55"/>
    <path d="M330 104 l22 -34 l18 26 l16 -22 l26 38z" fill="none" stroke="var(--b)" stroke-width="5"/>
    ${d.regions.map(r=>{const p=MAP.pts[r.id];return `<g data-b="${r.b}" data-fx="pop" data-d="0" style="transform-box:fill-box;transform-origin:center"><circle cx="${p[0]}" cy="${p[1]}" r="30" fill="var(--a)" opacity=".3" data-pulse="1"/><circle cx="${p[0]}" cy="${p[1]}" r="14" fill="var(--b)" stroke="#fff" stroke-width="4"/></g>`}).join('')}
   </svg>`+d.regions.map(r=>{const p=MAP.pts[r.id];const x=(p[0]+110)*s+p[2],y=(p[1]+10)*s+p[3];
    return `<div class="mlab" style="left:${x}px;top:${y}px" ${A(r.b,'pop',.1)}>${esc(r.name)}<span>${esc(r.note)}</span></div>`}).join('')+
   `<div class="mnote">Mapa esquemático · no oficial</div></div>`},
 cta(d){return `<div class="cta" style="display:flex;flex-direction:column;align-items:center;gap:30px"><div class="sig glow" ${A(0,'stampin')}>SÍGUEME</div>
   <div class="name" ${A(0,'pop',.25)}>${esc(TL.channel)}</div><div class="sub" ${A(0,'up',.45)}>Todo sobre GTA 6, cada día</div>
   <div class="fine" ${A(0,'up',.6)}>Canal de fans · No afiliado a Rockstar Games ni a Take-Two</div></div>`}
};

window.init=function(tl){TL=tl;document.body.className=tl.pal;
  $('#chan').textContent=tl.channel;$('#ep').textContent='GTA 6 · #'+String(tl.n).padStart(2,'0');
  let st='';for(let i=0;i<46;i++){const x=(i*397)%1080,y=(i*211)%820;st+=`<i style="left:${x}px;top:${y}px" data-ph="${i}"></i>`}
  $('#stars').innerHTML=st;
  $('#scenes').innerHTML=tl.scenes.map((s,i)=>`<div class="scene" data-i="${i}">${B[s.type](s.data)}</div>`).join('');
  tl.caps=[];tl.scenes.forEach(s=>s.beats.forEach(b=>{let ch=[],len=0;const flush=()=>{if(ch.length){tl.caps.push(ch);ch=[];len=0}};
    b.words.forEach(w=>{const L=w.w.length;if(ch.length&&(len+L>17||ch.length>=4))flush();ch.push(w);len+=L+1;if(/[.,:;?!]$/.test(w.w))flush()});flush()}));
  return document.fonts.ready.then(()=>true)};

function fx(el,type,p){let o=clamp(p*1.6),tr='';const e=eo(p),bk=back(p);
  if(type==='up')tr=`translateY(${(1-e)*70}px)`;
  else if(type==='left')tr=`translateX(${-(1-e)*220}px) skewX(${-(1-e)*10}deg)`;
  else if(type==='right')tr=`translateX(${(1-e)*220}px) skewX(${(1-e)*10}deg)`;
  else if(type==='pop')tr=`scale(${.4+.6*bk})`;
  else if(type==='stampin'){const s=2.3-1.3*eo(p*1.2);tr=`scale(${s})`+(el.classList.contains('stamp')?' rotate(-6deg)':'')}
  const base=el.dataset.base||'';el.style.opacity=o;el.style.transform=(base+' '+tr).trim()}

window.render=function(t){
  $('#sun').style.transform=`translateY(${Math.sin(t*.5)*14-t*1.2}px)`;
  $('#grid').style.backgroundPosition=`0 ${(t*170)%120}px`;
  $('#p1').style.transform=`rotate(${Math.sin(t*1.1)*1.6}deg)`;
  $('#p2').style.transform=`scaleX(-1) rotate(${Math.sin(t*1.1+1)*1.6}deg)`;
  $$('#stars i').forEach(s=>s.style.opacity=.25+.6*Math.abs(Math.sin(t*1.3+ +s.dataset.ph)));
  $('#prog b').style.width=(100*t/TL.dur)+'%';
  TL.scenes.forEach((s,i)=>{const el=$(`.scene[data-i="${i}"]`);const on=t>=s.start&&t<s.end;el.style.display=on?'flex':'none';if(!on)return;
    const out=clamp((s.end-t)/.16),inn=eo((t-s.start)/.3);
    el.style.opacity=i===TL.scenes.length-1?1:out;el.style.transform=`scale(${.94+.06*inn+(1-out)*.06})`;
    $$('[data-fx]',el).forEach(e=>{const b=s.beats[Math.min(+e.dataset.b,s.beats.length-1)];const t0=b.start-.1+ +e.dataset.d;fx(e,e.dataset.fx,(t-t0)/.42)});
    $$('[data-count]',el).forEach(e=>{const p=eo((t-s.beats[0].start)/.9);e.textContent=Math.round(+e.dataset.count*p)});
    $$('[data-w]',el).forEach(e=>{const b=s.beats[+e.dataset.b];e.style.width=(+e.dataset.w*eo((t-b.start-.1)/1.1))+'%'});
    $$('[data-pulse]',el).forEach(e=>{const k=1+.5*Math.abs(Math.sin(t*3));e.setAttribute('r',30*k)});
    $$('.mlab',el).forEach(e=>{const b=s.beats[+e.dataset.b];const act=t>=b.start-.1&&t<b.end+.2;e.style.borderColor=act?'#ffe14d':'';e.style.filter=act||t<b.start?'':'brightness(.75)'});
  });
  const cap=$('#cap');let cur=null;
  for(const ch of TL.caps){if(t>=ch[0].t0-.06&&t<ch[ch.length-1].t1+.1){cur=ch;break}}
  if(!cur){cap.innerHTML='';return}
  const p=back((t-cur[0].t0+.06)/.18);
  cap.innerHTML=cur.map(w=>`<span class="${t>=w.t0&&t<w.t1?'on':''}">${esc(w.w)}</span>`).join('');
  cap.style.transform=`scale(${.8+.2*p})`;
};
</script>
</body>
</html>
